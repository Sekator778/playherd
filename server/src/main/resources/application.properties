# Herd server config (предложение unless noted — see docs/research/server_design.md).
quarkus.application.name=herd-server
quarkus.http.port=8081

# --- Persistence (Р-20 "предложение": PostgreSQL + Flyway, event-sourced) ---
quarkus.datasource.db-kind=postgresql
# No quarkus.datasource.jdbc.url in dev/test on purpose -> Quarkus Dev Services starts a
# throwaway Postgres container automatically (task: "Dev Services Postgres is fine").
%prod.quarkus.datasource.username=${HERD_DB_USER:herd}
%prod.quarkus.datasource.password=${HERD_DB_PASSWORD:herd}
%prod.quarkus.datasource.jdbc.url=${HERD_DB_URL:jdbc:postgresql://postgres:5432/herd}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- Game mode (Р-46: mode=replay is the default for the local stand) ---
herd.mode=${HERD_MODE:replay}
herd.round-durations.hourly-sec=${HERD_ROUND_HOURLY_SEC:180}
herd.round-durations.daily-sec=${HERD_ROUND_DAILY_SEC:900}
herd.replay.speedup=${HERD_REPLAY_SPEEDUP:20}
herd.bots.count=${HERD_BOTS_COUNT:20}
herd.scheduler.tick-ms=${HERD_TICK_MS:1000}

# --- Operator (Р-43): bearer token stand-in, see docs/research/server_design.md ---
herd.operator.token=${HERD_OPERATOR_TOKEN:dev-operator-token-change-me}

# --- Auth session cookie (Р-4/Р-45) ---
herd.session.cookie-name=herd_session
herd.session.ttl-hours=${HERD_SESSION_TTL_HOURS:168}
herd.auth.challenge-ttl-sec=300

# --- chainsvc client (FIXED INTERFACE 3, port 8090) ---
herd.chainsvc.base-url=${HERD_CHAINSVC_URL:http://localhost:8090}
quarkus.rest-client.chainsvc.url=${herd.chainsvc.base-url}
# Wave-2 MINOR fix: raised from 3000/5000 now that the oracle-record push (OraclePublisherService)
# runs off the scheduler thread (see its class javadoc) — a slower chainsvc no longer costs
# round-processing latency on that path, so it can be given more room to answer under load before
# this server gives up and retries next tick, instead of needing an aggressively short timeout
# purely to bound how long it used to block the scheduler thread.
quarkus.rest-client.chainsvc.connect-timeout=5000
quarkus.rest-client.chainsvc.read-timeout=15000
herd.oracle.launcher-id=${HERD_ORACLE_LAUNCHER_ID:c5cb79a5ea20fb66a29c63867806dec4d1120fa002b386c6033fec09b9cdeb20}
herd.oracle.network=testnet11
# FIXED INTERFACE (a): bearer token this server sends chainsvc on every /v1/* call except
# GET /health; chainsvc's own C2_SVC_TOKEN must hold the same value (tools/stand.sh generates
# both into .env together, same value, for the local stand).
herd.chainsvc.token=${HERD_CHAINSVC_TOKEN:dev-chainsvc-token-change-me}

# --- Rate limiting (task item 2, Р-38 VPS stand-in) — предложение defaults: "generous limits",
# see docs/research/server_design.md for the reasoning. Per (ip, method) token bucket, methods
# listed in RpcResource.RATE_LIMITED_METHODS. ---
herd.ratelimit.capacity=${HERD_RATELIMIT_CAPACITY:30}
herd.ratelimit.refill-per-sec=${HERD_RATELIMIT_REFILL_PER_SEC:0.5}

# --- Reverse proxy trust (task item 2, BLOCKER security fix, docs/reviews/2026-09-26-independent-
# critique.md): behind nginx, RpcResource#clientIp used to read the raw TCP peer address, which is
# always nginx's own container address — every real player shared ONE rate-limit bucket per
# method (live-reproduced DoS). Quarkus's own forwarded-header support fixes this transparently:
# X-Forwarded-For (web/nginx.conf already sets it) is honored ONLY when the raw TCP peer is itself
# a trusted proxy — never RpcResource parsing the header itself. trusted-proxies defaults to the
# compose network subnet fixed in docker-compose.yml's networks.default.ipam block
# (172.28.77.0/24) — the only other member of that network besides db/server themselves is web
# (nginx); a header from any other peer (e.g. a request that reached `server` directly, bypassing
# nginx) is silently ignored, falling back to the raw peer address, never trusted, never an error.
# See docs/research/server_design.md "Rate limiting" for the reasoning and RateLimitTrustedProxyTest
# / RateLimitSpoofedProxyTest for both directions.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=false
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.trusted-proxies=${HERD_TRUSTED_PROXY_CIDR:172.28.77.0/24}

# --- Withdraw / deposit (Р-6) — task item 1 (BLOCKER security fix): disabled by default (no real
# on-chain CAT verifier exists yet, Р-6 decision pending with Alex) — see
# docs/research/server_design.md "Withdraw / deposit" and GameConfig#depositEnabled/
# #withdrawalEnabled.
herd.deposit.enabled=${HERD_DEPOSIT_ENABLED:false}
herd.withdrawal.enabled=${HERD_WITHDRAWAL_ENABLED:false}

# --- Session cookie transport security (task item 3) — false for the local http-only Docker
# stand (Р-44); set true once this is ever deployed behind TLS (Р-38 VPS) — see
# docs/research/server_design.md "Session cookie".
herd.cookie.secure=${HERD_COOKIE_SECURE:false}

# --- Hyperliquid public API (live mode markPx polling, Р-23 fallback) ---
quarkus.rest-client.hyperliquid.url=${HERD_HYPERLIQUID_URL:https://api.hyperliquid.xyz}
quarkus.rest-client.hyperliquid.connect-timeout=3000
quarkus.rest-client.hyperliquid.read-timeout=5000

# --- Execution adapter (task item 7, PLAN.md §3): HyperliquidAdapter is DISABLED by default and
# never sends a real order unless BOTH are set — see docs/research/server_design.md
# "Execution adapter" and HyperliquidAdapter/HyperliquidSigner's own javadoc for why even an
# explicitly-enabled+configured instance still cannot actually send anything today (EIP-712
# signing is not implemented in this pass).
herd.execution.hyperliquid.enabled=${HERD_HYPERLIQUID_EXECUTION_ENABLED:false}
herd.execution.hyperliquid.wallet-address=${HERD_HYPERLIQUID_WALLET_ADDRESS:}
herd.execution.hyperliquid.asset-index=${HERD_HYPERLIQUID_ASSET_INDEX:0}

quarkus.log.level=INFO
quarkus.log.category."crowdvsmarket.server".level=DEBUG

# --- Test profile: keep Dev Services Postgres, quieten noisy logs ---
%test.quarkus.log.level=INFO
