# Herd server config (proposal unless noted — see docs/research/server_design.md).
quarkus.application.name=herd-server
quarkus.http.port=8081

# --- Persistence (D-20 "proposal": PostgreSQL + Flyway, event-sourced) ---
quarkus.datasource.db-kind=postgresql
# No quarkus.datasource.jdbc.url in dev/test on purpose -> Quarkus Dev Services starts a
# throwaway Postgres container automatically (task: "Dev Services Postgres is fine").
%prod.quarkus.datasource.username=${HERD_DB_USER:herd}
%prod.quarkus.datasource.password=${HERD_DB_PASSWORD:herd}
%prod.quarkus.datasource.jdbc.url=${HERD_DB_URL:jdbc:postgresql://postgres:5432/herd}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- Game mode (D-46: mode=replay is the default for the local stand) ---
herd.mode=${HERD_MODE:replay}
herd.round-durations.hourly-sec=${HERD_ROUND_HOURLY_SEC:180}
herd.round-durations.daily-sec=${HERD_ROUND_DAILY_SEC:900}
herd.replay.speedup=${HERD_REPLAY_SPEEDUP:20}
herd.bots.count=${HERD_BOTS_COUNT:21}
# catalog = the bots module (21 bots, rules on candles); legacy = the five old strategies. Setting legacy rolls back without a code change.
herd.bots.engine=${HERD_BOTS_ENGINE:catalog}
# T-8: markets each bot bets on per round (distinct, random among the active ones).
herd.bots.markets-per-round=${HERD_BOTS_MARKETS_PER_ROUND:3}
herd.scheduler.tick-ms=${HERD_TICK_MS:1000}

# --- Economy stage B (D-92, docs/product/economy_implementation_plan.md B1-B7) ---
# The total the house accounts (TREASURY + HERD + the players) add up to at the cutover, in whole PLAY: the PLAY treasury coin on chain,
# 99 998 100 (checked on chain 2026-10-15). The first start of a server that has no EconomyCutover event in its log writes one; 0 = never.
herd.economy.treasury-opening-play=${HERD_ECONOMY_TREASURY_OPENING_PLAY:99998100}
# B3: new players per IP address per 24 hours (the address is kept only as a salted hash, for a day).
herd.registration.max-per-ip-per-day=${HERD_REGISTRATION_MAX_PER_IP_PER_DAY:3}
# All new players of a UTC day together, whatever their addresses (security review 2026-10-22, Alex: a daily limit next to the /64 one)
herd.registration.max-per-day=${HERD_REGISTRATION_MAX_PER_DAY:200}
# B4: a bot below this balance (whole PLAY) retires; its replacement comes after the delay (ms).
herd.bots.retire-below-play=${HERD_BOTS_RETIRE_BELOW_PLAY:100}
herd.bots.respawn-delay-ms=${HERD_BOTS_RESPAWN_DELAY_MS:3600000}
# The tests that are not about the economy keep the old rules (no cutover) and no registration limit; the ones that are switch them on
# with a test profile.
%test.herd.economy.treasury-opening-play=0
%test.herd.registration.max-per-ip-per-day=100000
%test.herd.registration.max-per-day=100000
# Fail-stop recovery (EngineRebuildService): the least time, in ms, between two attempts of the scheduler's
# rebuild retry while the engine is not ready (a settlement failed and the rebuild behind it failed too).
# D-107: the event journal is a Chronicle Queue in this directory (a docker volume in production); game_events is a copy filled after it.
herd.journal.dir=${HERD_JOURNAL_DIR:journal}
herd.journal.projector.enabled=${HERD_JOURNAL_PROJECTOR_ENABLED:true}
herd.journal.projector.batch=${HERD_JOURNAL_PROJECTOR_BATCH:2000}
# test mode: every append waits for the copy, so that a read of game_events after an answer sees it; production never waits for it
herd.journal.project-synchronously=${HERD_JOURNAL_PROJECT_SYNC:false}
%test.herd.journal.project-synchronously=true
%test.herd.journal.dir=target/test-journal
herd.rebuild.retry-ms=${HERD_REBUILD_RETRY_MS:2000}

# Snapshots of the engine state (architecture plan F5, SnapshotService): taken every N journal rows or every T minutes when there is
# anything new (checked every 30 s), the newest `keep` are kept; a restart loads the newest that verifies and replays the journal after
# it. The check replays the journal from zero up to the newest snapshot and compares the digests (cron; `off` disables it). The tests
# take snapshots only when they ask for one.
herd.snapshot.enabled=${HERD_SNAPSHOT_ENABLED:true}
herd.snapshot.every-events=${HERD_SNAPSHOT_EVERY_EVENTS:50000}
herd.snapshot.every-minutes=${HERD_SNAPSHOT_EVERY_MINUTES:60}
herd.snapshot.keep=${HERD_SNAPSHOT_KEEP:3}
herd.snapshot.check-cron=${HERD_SNAPSHOT_CHECK_CRON:0 30 3 * * ?}
%test.herd.snapshot.every-events=1000000000
%test.herd.snapshot.every-minutes=100000000
%test.herd.snapshot.check-cron=off

# E2 (docs/research/markets_architecture.md §4 item 17): the first player index of a NEW database is random in
# [2^20, 2^30) — the chain service keeps the deposit registry of every database that ever used it, and a deposit
# address derived from the same index twice is one address for two players. A database that has handed out an
# index is never touched. Set this to pin the first index; the tests do, to keep their indexes small.
%test.herd.players.first-index=0

# --- Operator (D-43): bearer token stand-in, see docs/research/server_design.md ---
herd.operator.token=${HERD_OPERATOR_TOKEN:dev-operator-token-change-me}

# --- What this deployment tells its clients (serverInfo, the sign-in text) ---
# The domain a player signs at sign-in (compose passes HERD_PUBLIC_DOMAIN; it was hard-coded herd.local).
herd.public-domain=${HERD_PUBLIC_DOMAIN:herd.local}
# The PLAY CAT's asset id (testnet11 issuance, docs/research/week1_testnet_results.md §3).
herd.play.asset-id=${HERD_PLAY_ASSET_ID:0x4b88ce9712e97e73ad3759541fc23d38704e31d27d6586c28be14ee716080b70}
# Whether the browser test wallet (D-45) is offered on the sign-in sheet.
herd.test-wallet.enabled=${HERD_TEST_WALLET_ENABLED:true}

# --- Auth session cookie (D-4/D-45) ---
herd.session.cookie-name=herd_session
herd.session.ttl-hours=${HERD_SESSION_TTL_HOURS:168}
# In-memory read-through of the sessions table (SessionCache): the longest a signed-out session can still work on ANOTHER
# instance; on this one a sign-out empties the entry at once. Keep it short.
herd.session.cache-ttl-seconds=${HERD_SESSION_CACHE_TTL_SECONDS:30}
herd.session.cache-max-entries=20000
herd.auth.challenge-ttl-sec=300

# --- chainsvc client (FIXED INTERFACE 3, port 8090) ---
herd.chainsvc.base-url=${HERD_CHAINSVC_URL:http://localhost:8090}
quarkus.rest-client.chainsvc.url=${herd.chainsvc.base-url}
# Wave-2 MINOR fix: raised from 3000/5000 now that the oracle-record push (OraclePublisherService)
# runs off the scheduler thread (see its class javadoc) — a slower chainsvc no longer costs
# round-processing latency on that path, so it can be given more room to answer under load before
# this server gives up and retries next tick, instead of needing an aggressively short timeout
# purely to bound how long it used to block the scheduler thread.
quarkus.rest-client.chainsvc.connect-timeout=5000
quarkus.rest-client.chainsvc.read-timeout=15000
herd.oracle.launcher-id=${HERD_ORACLE_LAUNCHER_ID:c5cb79a5ea20fb66a29c63867806dec4d1120fa002b386c6033fec09b9cdeb20}
herd.oracle.network=testnet11
# FIXED INTERFACE (a): bearer token this server sends chainsvc on every /v1/* call except
# GET /health; chainsvc's own C2_SVC_TOKEN must hold the same value (tools/stand.sh generates
# both into .env together, same value, for the local stand).
herd.chainsvc.token=${HERD_CHAINSVC_TOKEN:dev-chainsvc-token-change-me}

# --- Rate limiting (task item 2, D-38 VPS stand-in) — proposal defaults: "generous limits",
# see docs/research/server_design.md for the reasoning. Per (ip, method) token bucket, methods
# listed in RpcResource.RATE_LIMITED_METHODS. ---
herd.ratelimit.capacity=${HERD_RATELIMIT_CAPACITY:30}
herd.ratelimit.refill-per-sec=${HERD_RATELIMIT_REFILL_PER_SEC:0.5}
# D-106: the budget of ONE API key (a bot playing through `Authorization: Bearer`), apart from the per-address one above. Every call
# the key makes takes a token; a key past its budget gets 429 RATE_LIMITED. Defaults: a burst of 60, then 5 a second (300 a minute).
herd.ratelimit.bot.capacity=${HERD_RATELIMIT_BOT_CAPACITY:60}
herd.ratelimit.bot.refill-per-sec=${HERD_RATELIMIT_BOT_REFILL_PER_SEC:5}

# --- Push (docs/research/lmax_roadmap.md step 5): /api/ws, WebSocket "changed" notices; the client then reads the RPC. ---
# Off (false): the endpoint refuses the upgrade with 404 and nothing is published; the web app polls as before.
herd.push.enabled=${HERD_PUSH_ENABLED:true}
# At most one notice per topic per this many ms (the first change goes out at once, the ones that follow become one notice).
herd.push.coalesce-ms=${HERD_PUSH_COALESCE_MS:200}
# Limits: sockets on the server, per client address (proxy-aware, as the rate limits above), per signed-in player, topics per socket.
herd.push.max-connections=${HERD_PUSH_MAX_CONNECTIONS:5000}
herd.push.max-per-ip=${HERD_PUSH_MAX_PER_IP:20}
herd.push.max-per-player=${HERD_PUSH_MAX_PER_PLAYER:6}
herd.push.max-topics=${HERD_PUSH_MAX_TOPICS:40}
# A slow client: notices written and not yet sent past max-pending-sends are dropped for it (it then reads everything again);
# max-dropped-notices lost in a row disconnect it. A socket is closed after max-age-sec (the client reconnects).
herd.push.max-pending-sends=${HERD_PUSH_MAX_PENDING_SENDS:64}
herd.push.max-dropped-notices=${HERD_PUSH_MAX_DROPPED_NOTICES:200}
herd.push.max-age-sec=${HERD_PUSH_MAX_AGE_SEC:3600}
herd.push.client-messages-per-sec=${HERD_PUSH_CLIENT_MESSAGES_PER_SEC:5}
# The ticker announces a market's price at most this often (a quote can change many times a second; every notice makes each
# listening client read again). A round moving on is announced at once.
herd.push.price-interval-ms=${HERD_PUSH_PRICE_INTERVAL_MS:1000}
# Upgrade attempts per client address: a token bucket like the RPC ones (a burst of 20, then one every 2 seconds).
herd.push.upgrade.capacity=${HERD_PUSH_UPGRADE_CAPACITY:20}
herd.push.upgrade.refill-per-sec=${HERD_PUSH_UPGRADE_REFILL_PER_SEC:0.5}

# --- Reverse proxy trust (task item 2, BLOCKER security fix, docs/reviews/2026-09-26-independent-
# critique.md): behind nginx, RpcResource#clientIp used to read the raw TCP peer address, which is
# always nginx's own container address — every real player shared ONE rate-limit bucket per
# method (live-reproduced DoS). Quarkus's own forwarded-header support fixes this transparently:
# X-Forwarded-For (web/nginx.conf already sets it) is honored ONLY when the raw TCP peer is itself
# a trusted proxy — never RpcResource parsing the header itself. trusted-proxies defaults to the
# compose network subnet fixed in docker-compose.yml's networks.default.ipam block
# (172.28.77.0/24) — the only other member of that network besides db/server themselves is web
# (nginx); a header from any other peer (e.g. a request that reached `server` directly, bypassing
# nginx) is silently ignored, falling back to the raw peer address, never trusted, never an error.
# See docs/research/server_design.md "Rate limiting" for the reasoning and RateLimitTrustedProxyTest
# / RateLimitSpoofedProxyTest for both directions.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=false
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.trusted-proxies=${HERD_TRUSTED_PROXY_CIDR:172.28.77.0/24}

# Request bodies: a call is a few hundred bytes (the largest, a feedback text of 2000 characters or a list of round ids, stays far
# below); the Quarkus default of 10 MB was parsed whole (security review 2026-10-22, H2).
quarkus.http.limits.max-body-size=64K

# Per-address budgets of the calls that write for free (RpcResource; a bucket of `capacity`, refilled at the rate given): bot and
# key management (createBot, regenerateBotKey, revokeBotKey: 5, then 3 a minute), setNickname (10, then 10 a minute),
# acknowledgeResults (60, then 1 a second; one call per settled round the player had a bet in). A person never reaches them.
# The tests share one application and one address, so only the tests of the limits themselves use the real figures.
herd.ratelimit.manage.capacity=${HERD_RATELIMIT_MANAGE_CAPACITY:5}
herd.ratelimit.manage.refill-per-minute=${HERD_RATELIMIT_MANAGE_REFILL_PER_MINUTE:3}
herd.ratelimit.nickname.capacity=${HERD_RATELIMIT_NICKNAME_CAPACITY:10}
herd.ratelimit.nickname.refill-per-minute=${HERD_RATELIMIT_NICKNAME_REFILL_PER_MINUTE:10}
herd.ratelimit.ack.capacity=${HERD_RATELIMIT_ACK_CAPACITY:60}
herd.ratelimit.ack.refill-per-second=${HERD_RATELIMIT_ACK_REFILL_PER_SECOND:1}
%test.herd.ratelimit.manage.capacity=100000
%test.herd.ratelimit.nickname.capacity=100000
%test.herd.ratelimit.ack.capacity=100000
# Feedback messages one address may send in 24 hours, inside the global herd.feedback.max-per-day: one source cannot close the form.
herd.feedback.rate-limit.per-ip-per-day=${HERD_FEEDBACK_PER_IP_PER_DAY:10}
%test.herd.feedback.rate-limit.per-ip-per-day=100000
# Sessions one player may hold; signing in past it ends the oldest. Expired sessions and sign-in challenges are deleted hourly.
herd.session.max-per-player=${HERD_SESSION_MAX_PER_PLAYER:20}

# --- In-app feedback (D-81, docs/research/server_design.md §22): submitFeedback is open to everyone, signed in or not, and
# writes to the database, so it has a budget of its own, far stricter than the shared one above. Per client address (the
# same proxy-aware address as the limit above): a bucket of `capacity` messages that gets `refill-per-hour` back every hour
# — 5 in a burst, then one every 10 minutes. `max-per-day` is a cap on everyone together: with that many messages in the
# last 24 hours every submit answers 429 RATE_LIMITED until older ones drop out of the count (0 closes the door). ---
herd.feedback.rate-limit.capacity=${HERD_FEEDBACK_RATE_LIMIT_CAPACITY:5}
herd.feedback.rate-limit.refill-per-hour=${HERD_FEEDBACK_RATE_LIMIT_REFILL_PER_HOUR:6}
herd.feedback.max-per-day=${HERD_FEEDBACK_MAX_PER_DAY:1000}

# --- Country of a feedback message (D-81): the server derives it from the client address with the DB-IP "IP to Country
# Lite" database (MMDB, CC BY 4.0, no registration) and drops the address — it is neither stored nor logged. The database is
# not shipped: a background thread downloads the file of the current month (UTC) from the url-template — YYYY-MM in it
# stands for the month — or the file of the month before when this one is not published yet (404), and looks again about
# every 7 days. It never delays the start or a request: until the file has arrived (or when it cannot, one WARN per
# attempt), the country of a message is simply empty. mmdb-path names a file to use INSTEAD of downloading (re-read when it
# changes). Off in the tests, which never touch the network. With it on, the server must reach download.db-ip.com. ---
herd.geoip.enabled=${HERD_GEOIP_ENABLED:true}
%test.herd.geoip.enabled=false
herd.geoip.url-template=${HERD_GEOIP_URL_TEMPLATE:https://download.db-ip.com/free/dbip-country-lite-YYYY-MM.mmdb.gz}
herd.geoip.mmdb-path=${HERD_GEOIP_MMDB_PATH:}

# --- Withdraw / deposit (D-6/D-53) — real on-chain PLAY against chainsvc's FIXED INTERFACE
# (/v1/play/*). Disabled by default; set true once chainsvc is deployed with those endpoints — see
# docs/research/server_design.md "Real PLAY withdraw/deposit" and GameConfig#depositEnabled/
# #withdrawalEnabled for exactly what each flag gates (requestDeposit's old self-report RPC is
# permanently retired regardless of herd.deposit.enabled).
herd.deposit.enabled=${HERD_DEPOSIT_ENABLED:false}
herd.withdrawal.enabled=${HERD_WITHDRAWAL_ENABLED:false}

# --- Session cookie transport security (task item 3) — false for the local http-only Docker
# stand (D-44); set true once this is ever deployed behind TLS (D-38 VPS) — see
# docs/research/server_design.md "Session cookie".
herd.cookie.secure=${HERD_COOKIE_SECURE:false}

# --- Hyperliquid public API (live mode markPx polling, D-23 fallback) ---
quarkus.rest-client.hyperliquid.url=${HERD_HYPERLIQUID_URL:https://api.hyperliquid.xyz}
quarkus.rest-client.hyperliquid.connect-timeout=3000
quarkus.rest-client.hyperliquid.read-timeout=5000

# --- Execution adapter (task item 7, the project plan §3): HyperliquidAdapter is DISABLED by default and
# never sends a real order unless BOTH are set — see docs/research/server_design.md
# "Execution adapter" and HyperliquidAdapter/HyperliquidSigner's own javadoc for why even an
# explicitly-enabled+configured instance still cannot actually send anything today (EIP-712
# signing is not implemented in this pass).
herd.execution.hyperliquid.enabled=${HERD_HYPERLIQUID_EXECUTION_ENABLED:false}
herd.execution.hyperliquid.wallet-address=${HERD_HYPERLIQUID_WALLET_ADDRESS:}
herd.execution.hyperliquid.asset-index=${HERD_HYPERLIQUID_ASSET_INDEX:0}

quarkus.log.level=INFO
quarkus.log.category."crowdvsmarket.server".level=DEBUG

# --- Test profile: keep Dev Services Postgres, quieten noisy logs ---
%test.quarkus.log.level=INFO
# a free port for every test run, so that runs side by side (worktrees, agents) do not fail on "Port already bound: 8081"
%test.quarkus.http.test-port=0
