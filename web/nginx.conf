# Serves the built SPA and proxies /api to the Quarkus backend. Compose service name "server"
# (Р-44's local Docker stand, compose project "herd") — предложение: the exact service name is
# this Dockerfile's own assumption, not fixed by any doc; keep it in sync with docker-compose.yml.
# Tunnel demo (`make tunnel-up`, docs/product/local_stand.md): cloudflared runs on the host and
# reaches this nginx through the published port, so every visitor of the tunnel arrives from the
# compose network's gateway and all of them would share one rate-limit bucket per method
# (measured 2026-10-02 on the stand: requests from the host are logged with 172.28.77.1).
# Cloudflare puts the visitor's address into CF-Connecting-IP and overwrites whatever the visitor
# sent in that header, so it is honest for traffic that came through the tunnel. It is trusted ONLY
# from that gateway address (the stand's subnet is fixed in docker-compose.yml); from any other
# peer — a VPS behind Caddy, a request that reached nginx directly — the header is ignored. A
# device on the same Wi-Fi also arrives from the gateway here and could send the header itself:
# on the home stand that is accepted, the limit is there for visitors from the internet.
geo $herd_from_host {
    default 0;
    172.28.77.1 1;
}
map "$herd_from_host:$http_cf_connecting_ip" $herd_client_ip {
    default $remote_addr;
    "~^1:(?<herd_cf_ip>[0-9A-Fa-f:.]{3,45})$" $herd_cf_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # FIXED INTERFACE (1): every RPC call and GET /api/rounds/{id}/results.json goes straight
    # through, live, every time — never cached or short-circuited by nginx itself.
    location /api/ {
        # Fix (tools/stand.sh integration, Р-44): server/Dockerfile EXPOSEs 8081 and
        # server/src/main/resources/application.properties hardcodes quarkus.http.port=8081 —
        # this was pointing at 8080, which the server never listens on. See
        # docs/product/local_stand.md "Известные ограничения и фиксы".
        proxy_pass http://server:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Verification fix (2026-09-26, docs/reviews/2026-09-26-independent-critique.md task item
        # 2 re-probe): this nginx IS the internet-facing edge (docker-compose.yml: only `web` is
        # published to the host, 0.0.0.0:8480) — there is no further trusted hop in front of it
        # whose original client value needs preserving. `$proxy_add_x_forwarded_for` APPENDS
        # nginx's own view of the caller after whatever X-Forwarded-For the caller already sent,
        # but Quarkus's own forwarded-header parsing (io.quarkus.vertx.http.runtime.
        # ForwardedParser#processXForwarded, confirmed by decompiling quarkus-vertx-http
        # 3.33.3 — no config flag changes this) takes the FIRST comma-separated element of that
        # header as the client, once a request's raw TCP peer is a trusted proxy
        # (quarkus.http.proxy.trusted-proxies). So an external caller hitting this port directly
        # could set its OWN X-Forwarded-For and have Quarkus trust that attacker-chosen value —
        # reproduced live: after exhausting the real per-IP bucket (30 requests), three more
        # authChallenge calls through nginx each with a different spoofed X-Forwarded-For value
        # got fresh 200s instead of the expected 429, fully bypassing the rate limiter task item 2
        # exists to fix. Setting X-Forwarded-For to nginx's OWN observed $remote_addr (never
        # appending/preserving a caller-supplied value, since none is legitimate at the true edge)
        # closes this: Quarkus's "first element" always resolves to nginx's own honest view of the
        # caller, matching the trust boundary quarkus.http.proxy.trusted-proxies already assumes.
        # Multi-device LAN/phone testing (Р-48) is unaffected — each device still gets its own
        # $remote_addr and thus its own bucket, since nothing about that path involves the client
        # itself supplying X-Forwarded-For.
        # ($herd_client_ip is $remote_addr except for tunnel traffic — see the map above.)
        proxy_set_header X-Forwarded-For $herd_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keeps the httpOnly `herd_session` cookie's Path attribute intact end to end.
        proxy_cookie_path / /;
    }

    # The service worker and manifest must never be cached long — otherwise a shipped app-shell
    # update can't roll out even after a hard refresh (public/sw.js's own cache-busting only
    # helps once the browser re-fetches sw.js itself).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite's content-hashed build assets — safe to cache for a long time, a new build always
    # gets new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — react-router's client-side routes (e.g. /round/:roundId) must resolve to
    # index.html on a hard refresh or a direct link, not a raw 404 from nginx.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
