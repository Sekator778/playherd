<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` + `env(safe-area-inset-*)` in `index.css`: in "Add to Home Screen" mode
         (`black-translucent` status bar below) the page is drawn under the status bar/notch, so the
         header, tab bar and page gutters pad themselves by the inset instead (HANDOFF §6 п.10). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Herd — crowd vs market</title>
    <meta
      name="description"
      content="Herd — bet up or down with the crowd, against the market. A toy-money game on Chia testnet11: no real money."
    />
    <!-- Link preview in Discord / Telegram (gtm decision D-11, 2026-10-11): a text card only. No `og:image`
         and no `og:url` — both must be absolute, and the same build runs on any host. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Herd" />
    <meta property="og:title" content="Herd — crowd vs market" />
    <meta
      property="og:description"
      content="Bet up or down with the crowd, against the market. A toy-money game on Chia testnet11: no real money."
    />
    <meta name="twitter:card" content="summary" />
    <!-- PWA (task item 3, Р-48): installable on Android/iPhone home screens. `%BASE_URL%` is
         Vite's own placeholder (replaced at build time with `vite.config.ts`'s `base` — "/" for
         the real Docker/web build, "./" only for a future local-asset Capacitor build), so these
         resolve against the site root instead of against whatever nested route's URL happened to
         serve this same `index.html` via the SPA fallback (polish item 4, 2026-09-26 — a plain
         relative path here broke exactly the same way the built JS/CSS did). -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" href="%BASE_URL%icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Herd" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
