name: engine

# Builds and tests the off-chain leverage/liquidation engine (engine/).
# Cannot actually run yet: this repository has no GitHub remote to trigger it from
# (PLAN.md day 1, 2026-09-25) — kept here, valid, ready for when one exists.

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn -B verify
        run: mvn -B verify
