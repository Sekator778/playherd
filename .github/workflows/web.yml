name: web

# Builds, lints and tests the frontend (web/) — built against src/api/contract.ts on MockApi
# data (Р-35), no backend required. Cannot actually run yet: this repository has no GitHub
# remote to trigger it from (PLAN.md day 1, 2026-09-25) — kept here, valid, ready for when one
# exists.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm run lint
        run: npm run lint

      - name: npm test -- --run
        run: npm test -- --run

      - name: npm run build
        run: npm run build
