# Dependabot version-update config for Herd. Weekly, grouped per ecosystem so routine minor/
# patch bumps land as one PR instead of one-per-package — matches docs/ops/branching.md's
# "less manual motion" goal (fewer PRs to individually review/merge into develop).
#
# Security updates (separate from this file, no config needed here) are toggled via the repo API
# by tools/github/setup-repo.sh §4 ("Dependabot security updates" / "Dependabot alerts").
#
# `target-branch` is left unset on purpose: PRs go to the repo's default branch. If
# tools/github/setup-repo.sh is run with --apply (default: switches default branch to
# `develop` — see its §2 for the rationale), Dependabot PRs land on `develop` automatically. If
# run with --keep-default-branch instead, uncomment `target-branch: develop` in every entry below
# so dependency bumps still go through the same PR -> develop -> main flow rather than main
# directly (docs/ops/branching.md §2).

version: 2
updates:
  # --- GitHub Actions (workflow-pinned actions in .github/workflows/) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # target-branch: develop

  # --- web/ (npm) ---
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # target-branch: develop

  # --- chain/ (cargo workspace: c2-cli, c2-svc, sim-spike) ---
  - package-ecosystem: "cargo"
    directory: "/chain"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      chain-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # target-branch: develop

  # --- root (Maven reactor: engine/ + server/, see pom.xml) ---
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # target-branch: develop
