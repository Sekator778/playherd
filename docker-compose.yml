# Local test stand (Р-44): 2–4 browser windows/phone = 2–4 players in one shared game.
# Separate compose project "herd" — never touches other containers on this machine.
# Run via tools/stand.sh (up|down|logs|status|reset), not `docker compose` directly, so the
# "don't touch other herd-*-looking or unrelated containers" checks in that script always run
# first.
#
# Only `web` is published to the host (0.0.0.0:${HERD_WEB_PORT:-8480}) so a phone on the same
# Wi-Fi can open it (Р-48). `db` is internal-only, reached by `server` over the compose network
# by service name.
#
# chainsvc is the one exception to "everything talks over the compose network by service name":
# it runs with `network_mode: host` (see the fix note on that service below) so its outbound
# calls to testnet11 actually leave the machine. Compose forbids combining `network_mode` with
# `networks:`, so it cannot also carry the "chainsvc" DNS name on `herd_default` — `server`
# instead reaches it via `herd_default`'s own gateway IP, fixed below at 172.28.77.1 precisely so
# that address is known at compose-file-write time (see HERD_CHAINSVC_URL on `server`).
#
# Live prices (Р-70, docs/research/markets_architecture.md §10): `server` follows the real
# Hyperliquid / Polymarket prices by default, so it needs outbound internet too — see the
# `herd_default` network below. Every HERD_* of `server` can be overridden from `.env`.

name: herd

networks:
  default:
    name: herd_default
    # `server` fetches live prices from api.hyperliquid.xyz, Coinbase Exchange, Kraken and Polymarket
    # (HERD_PRICES_SOURCE=live, the default below; HERD_PRICES_DISABLED_VENUES switches any of them off), and, in the
    # background, the DB-IP country database (a few MB, at start and when a new month's file is out) from
    # download.db-ip.com (Р-81: the country of a feedback message; HERD_GEOIP_ENABLED=false switches it off).
    # This Mac's Docker daemon turns IP masquerading off for every bridge
    # network (`ip-masq: false` in ~/.orbstack/config/docker.json — see the chainsvc fix note
    # below), which leaves containers on a bridge with no route to the internet. Re-enabling it for
    # this one network gives `server` egress without touching the daemon-wide setting; it is the
    # Docker default anywhere else (CI runners, other machines), so there it changes nothing.
    # NOT verified from here: first `tools/stand.sh up` prints whether `server` really reaches the
    # price source. No egress wanted/possible: HERD_PRICES_SOURCE=synthetic in .env (no external
    # source at all), or HERD_MODE=replay (the old accelerated BTC history, offline).
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.28.77.0/24
          gateway: 172.28.77.1

services:
  db:
    image: postgres:16-alpine
    # shared_buffers is PostgreSQL's own default (128MB) unless HERD_DB_SHARED_BUFFERS is set: the VPS kit sets it from the RAM of the
    # machine (tools/vps/env-init.sh --profile oracle). It is the size of a cache that fills as data is read, not a memory reservation.
    command: ["postgres", "-c", "shared_buffers=${HERD_DB_SHARED_BUFFERS:-128MB}"]
    environment:
      POSTGRES_USER: herd
      # Task item 3 (security minor): generated into .env by tools/stand.sh, same pattern as
      # HERD_OPERATOR_TOKEN/HERD_CHAINSVC_TOKEN below — was hardcoded "herd"/"herd" (a trivial,
      # public-repo-visible password), harmless only because `db` has no `ports:` mapping today.
      # Postgres only applies POSTGRES_PASSWORD while initializing an EMPTY data directory — an
      # existing volume keeps whatever password it was created with; see
      # docs/research/server_design.md "Postgres password" for the ALTER USER step a volume
      # created before this change needs once, so it isn't silently locked out of its own data.
      # (herd_pg_live below is new, so it takes the password from .env.)
      POSTGRES_PASSWORD: ${HERD_DB_PASSWORD:?set in .env — run tools/stand.sh up, which generates one}
      POSTGRES_DB: herd
    volumes:
      - herd_pg_live:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herd -d herd"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # FIXED INTERFACE (3): "chainsvc", port 8090. Talks to testnet11 for real (C2_PUSH=1) using the
  # operator key/oracle-singleton state already launched on this Mac (launcher
  # c5cb79a5ea20fb66a29c63867806dec4d1120fa002b386c6033fec09b9cdeb20,
  # ~/.c2/testnet11/operator.oracle.json) — bind-mounted read-write so oracle-state advances and
  # this service's durable publish queue persist across restarts, exactly like `c2-cli` itself.
  chainsvc:
    build:
      context: ./chain
      dockerfile: c2-svc/Dockerfile
      # Fix: this machine's default Docker bridge network has no DNS/egress (confirmed:
      # `docker run alpine wget https://…` fails, `docker run --network host alpine wget …`
      # succeeds) — `cargo build` needs crates.io. Same root cause the "chain service" agent
      # hit and documented in docs/research/chain_service.md §6. See
      # docs/product/local_stand.md "Известные ограничения и фиксы".
      # HERD_BUILD_NETWORK: the VPS sets `default` (tools/vps/env-init.sh). Compose v5 builds through Bake, which refuses a
      # host-network build without --allow=network.host (measured on the VPS, Compose v5.6.0, 2026-10-11), and the bridge of
      # an ordinary Linux host has egress. Unset (this Mac): host, as before.
      network: ${HERD_BUILD_NETWORK:-host}
    # Fix (runtime, not just build — see docs/product/local_stand.md "Известные ограничения и
    # фиксы" for the full story): this machine's compose/bridge networks (`ip-masq` disabled —
    # confirmed via `docker network inspect`/`~/.orbstack/config/docker.json`) give containers on
    # them NO internet egress at all, not even by raw IP (verified: a plain `nc -zv <coinset IP>
    # 443` from a bridge-network container times out). `network_mode: host` is the only network
    # mode on this machine that actually reaches the internet (verified: real testnet11
    # `GET /v1/oracle/status` succeeds under it) — required for chainsvc's real testnet11 pushes
    # (Р-47). Compose forbids `networks:` together with `network_mode`, so this service is NOT on
    # `herd_default`; `server` reaches it via the gateway IP instead (see `server.environment`).
    network_mode: host
    environment:
      # C2_PUSH=0 (dry-run) in .env for a stand with no operator key of its own (a second publisher must never run; economy finish).
      C2_PUSH: "${C2_PUSH:-1}"
      C2_DATA_DIR: /data
      C2_OPERATOR_NAME: operator
      C2_SVC_PORT: "8090"
      # FIXED INTERFACE (a): bearer-token auth on every /v1/* endpoint except GET /health; same
      # value as `server`'s HERD_CHAINSVC_TOKEN below (tools/stand.sh generates both together into
      # .env). C2_BIND_ADDR: with network_mode: host (see the fix note above), 0.0.0.0 would also
      # accept connections from outside this machine — bind only to loopback (this container's own
      # localhost, e.g. `curl localhost:8090` for debugging) and the herd_default gateway IP
      # (172.28.77.1, how `server` actually reaches it, since chainsvc itself isn't on that
      # network — see the fix note above).
      C2_SVC_TOKEN: ${C2_SVC_TOKEN:?set in .env — run tools/stand.sh up, which generates one}
      C2_BIND_ADDR: "127.0.0.1,172.28.77.1"
      # The fee cap of one oracle publish (and of its replacements). When the testnet11 mempool is
      # full, the node takes nothing below 5 mojos per unit of cost (`nonzero_fee_minimum_fpc`,
      # docs/research/chain_service.md §17.9) — a 40-record batch then needs a few hundred million
      # mojos, above the service's default cap of 50 000 000, and publishing stopped on 2026-10-14
      # (F2 in docs/product/feedback/wave1-log.md). 1 000 000 000 mojos = 0.001 TXCH per batch at most.
      C2_MAX_FEE_MOJOS: ${C2_MAX_FEE_MOJOS:-1000000000}
    volumes:
      - ${C2_DATA_HOST_DIR:-${HOME}/.c2/testnet11}:/data
    healthcheck:
      # debian:bookworm-slim (chain/c2-svc/Dockerfile's runtime stage) has no curl/wget — speak
      # HTTP over bash's /dev/tcp and require a 200 from /health, which turns 503 when the
      # oracle publisher keeps failing (chain_service.md §12), not just "the port is open".
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q \" 200 \"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # FIXED INTERFACE (1)/(2): the Quarkus game server. The stand plays on live prices (Р-70,
  # docs/research/markets_architecture.md §10) with Р-46's short test rounds. Every HERD_* below is
  # explicit anyway so the stand's actual configuration is visible here rather than implied by a
  # default someone could change; the market/price ones take their value from `.env` when it sets
  # one (the defaults here are §10's table).
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      # Fix: same no-DNS/egress default bridge network as chainsvc above — `mvn` needs Maven
      # Central. The "server" agent's report hit this too (needed `--network host` in its own
      # sandbox); this machine has the identical restriction outside any sandbox.
      network: ${HERD_BUILD_NETWORK:-host} # the VPS: default (see chainsvc above)
    environment:
      # The heap of the server JVM, in MiB, when .env sets HERD_SERVER_HEAP_MB (the VPS kit does, from the RAM of the machine:
      # tools/vps/env-init.sh --profile oracle): -Xms equal to -Xmx and AlwaysPreTouch, so the JVM takes the whole heap at start
      # and holds it. Not set (the Mac stand): no options, the JVM sizes itself as before. server/Dockerfile starts `java` directly,
      # so JAVA_OPTS and JAVA_OPTS_APPEND are read by nothing; the java launcher reads JDK_JAVA_OPTIONS (it prints one
      # "NOTE: Picked up JDK_JAVA_OPTIONS:" line at start, empty or not).
      JDK_JAVA_OPTIONS: "${HERD_SERVER_HEAP_MB:+-Xms${HERD_SERVER_HEAP_MB}m -Xmx${HERD_SERVER_HEAP_MB}m -XX:+AlwaysPreTouch}"
      # live = markets and prices from the sources; replay = the old accelerated BTC-only history,
      # for tests and offline use (HERD_MODE=replay in .env).
      HERD_MODE: ${HERD_MODE:-live}
      # live = Hyperliquid + Coinbase + Polymarket; synthetic = deterministic random walk, no network (what
      # docker-compose.ci.yml uses). Ignored when HERD_MODE=replay.
      HERD_PRICES_SOURCE: ${HERD_PRICES_SOURCE:-live}
      HERD_ROUND_HOURLY_SEC: ${HERD_ROUND_HOURLY_SEC:-180} # Р-46: test-mode "hourly" round = 3 min
      HERD_ROUND_DAILY_SEC: ${HERD_ROUND_DAILY_SEC:-900} # Р-46: test-mode "daily" round = 15 min
      HERD_REPLAY_SPEEDUP: ${HERD_REPLAY_SPEEDUP:-20} # HERD_MODE=replay only
      HERD_BOTS_COUNT: ${HERD_BOTS_COUNT:-20} # Р-46: 20 labelled bots
      HERD_BOTS_MARKETS_PER_ROUND: ${HERD_BOTS_MARKETS_PER_ROUND:-3} # Т-8: pairs each bot plays per round
      # Market lists by category (Т-1/Т-10, §10); names are the source's own (`xyz:` = Hyperliquid's
      # xyz dex). Polymarket politics/sports markets are picked from the live catalog. Crypto is priced by
      # the asset's own venue: Coinbase Exchange USD products (BTC-USD …) and the Hyperliquid spot pair HYPE/USDC,
      # each with the leverage cap of the pair; HERD_MARKETS_CRYPTO lists Hyperliquid *perpetuals* (empty: none).
      # HERD_MARKETS_SPOT_BACKUP names the exchange behind each of them (Kraken for the Coinbase coins, Coinbase for
      # HYPE; `none` for a coin without one): a round opens on the main exchange when it has a live price at the start,
      # on the backup otherwise, and runs and settles there to its end (Р-76). It is fixed when a market is listed.
      # HERD_PRICES_DISABLED_VENUES (hyperliquid, coinbase, kraken; comma-separated) switches an exchange off entirely:
      # no stream and no request to it, the rounds of its markets open on the backup.
      HERD_MARKETS_CRYPTO: "${HERD_MARKETS_CRYPTO:-}"
      HERD_MARKETS_COINBASE: "${HERD_MARKETS_COINBASE:-BTC-USD,ETH-USD,SOL-USD,XRP-USD,DOGE-USD}"
      HERD_MARKETS_HYPERLIQUID_SPOT: "${HERD_MARKETS_HYPERLIQUID_SPOT:-HYPE}"
      HERD_MARKETS_SPOT_MAX_LEVERAGE: "${HERD_MARKETS_SPOT_MAX_LEVERAGE:-BTC:40,ETH:25,SOL:20,XRP:20,DOGE:10,HYPE:10}"
      HERD_MARKETS_SPOT_BACKUP: "${HERD_MARKETS_SPOT_BACKUP:-BTC:kraken,ETH:kraken,SOL:kraken,XRP:kraken,DOGE:kraken,HYPE:coinbase}"
      HERD_PRICES_DISABLED_VENUES: "${HERD_PRICES_DISABLED_VENUES:-}"
      # A round whose exchange stopped sending prices holds its series (the rounds of a series are settled in order).
      # HERD_PRICES_VENUE_RELEASE_AFTER_MS after the end of such a round of a crypto market — or after the start of the
      # server, if that is later: a restart, or the wake of a host that slept, gives the round its minutes again — while the
      # market's other exchange is alive, the round is cancelled with a refund and the series goes on; 0 turns that off —
      # the round then waits for its exchange and is refunded an hour after its end (Р-77).
      HERD_PRICES_VENUE_RELEASE_AFTER_MS: "${HERD_PRICES_VENUE_RELEASE_AFTER_MS:-120000}"
      # On every market, not only on one with a backup: a round that cannot be priced is cancelled with a refund this many
      # milliseconds after its end — or after the start of the server, if that is later: a restart, or the wake of a host that
      # slept, gives the rounds that were running their minutes to heal from the candles — and its series goes on. One wait
      # per price source: Hyperliquid's perpetuals (both dexes), Hyperliquid spot, Coinbase, Kraken, Polymarket, the synthetic
      # walk. 0 turns it off for a source — its rounds then wait for the hour of Р-23, which stays the upper bound. A round
      # nobody bet on that cannot be priced is skipped at once (Р-79).
      HERD_PRICES_HYPERLIQUID_RELEASE_AFTER_MS: "${HERD_PRICES_HYPERLIQUID_RELEASE_AFTER_MS:-300000}"
      HERD_PRICES_HYPERLIQUID_SPOT_RELEASE_AFTER_MS: "${HERD_PRICES_HYPERLIQUID_SPOT_RELEASE_AFTER_MS:-300000}"
      HERD_PRICES_COINBASE_RELEASE_AFTER_MS: "${HERD_PRICES_COINBASE_RELEASE_AFTER_MS:-300000}"
      HERD_PRICES_KRAKEN_RELEASE_AFTER_MS: "${HERD_PRICES_KRAKEN_RELEASE_AFTER_MS:-300000}"
      HERD_PRICES_POLYMARKET_RELEASE_AFTER_MS: "${HERD_PRICES_POLYMARKET_RELEASE_AFTER_MS:-900000}"
      HERD_PRICES_SYNTHETIC_RELEASE_AFTER_MS: "${HERD_PRICES_SYNTHETIC_RELEASE_AFTER_MS:-300000}"
      HERD_MARKETS_STOCKS: "${HERD_MARKETS_STOCKS:-xyz:NVDA,xyz:TSLA}"
      HERD_MARKETS_INDICES: "${HERD_MARKETS_INDICES:-xyz:SP500,xyz:XYZ100}"
      HERD_MARKETS_COMMODITIES: "${HERD_MARKETS_COMMODITIES:-xyz:GOLD,xyz:BRENTOIL}"
      HERD_MARKETS_POLYMARKET_ENABLED: ${HERD_MARKETS_POLYMARKET_ENABLED:-true}
      HERD_MARKETS_POLITICS_COUNT: ${HERD_MARKETS_POLITICS_COUNT:-3}
      HERD_MARKETS_SPORTS_COUNT: ${HERD_MARKETS_SPORTS_COUNT:-3}
      HERD_MARKETS_ODDS_MAX_LEVERAGE: ${HERD_MARKETS_ODDS_MAX_LEVERAGE:-10}
      # Т-9: a fresh DB starts its oracle `seq` at 1 while the testnet11 singleton is already far
      # ahead — with this on, the scheduler settles no round until chainsvc has reported the highest
      # `seq` it knows (§7 п. 4).
      HERD_ORACLE_REQUIRE_SEQ_FLOOR: ${HERD_ORACLE_REQUIRE_SEQ_FLOOR:-true}
      # The domain in the text a player signs at sign-in (was hard-coded herd.local).
      HERD_PUBLIC_DOMAIN: ${HERD_PUBLIC_DOMAIN:-herd.local}
      # The session cookie carries the Secure flag behind HTTPS (the VPS kit sets it in .env; the Mac stand is plain http).
      HERD_COOKIE_SECURE: ${HERD_COOKIE_SECURE:-false}
      # What serverInfo tells the web: whether the sign-in sheet offers the browser test wallet
      # (Р-45), and the PLAY asset id of this deployment (empty → the server's default, the
      # testnet11 issuance).
      HERD_TEST_WALLET_ENABLED: ${HERD_TEST_WALLET_ENABLED:-true}
      HERD_PLAY_ASSET_ID: ${HERD_PLAY_ASSET_ID:-0x4b88ce9712e97e73ad3759541fc23d38704e31d27d6586c28be14ee716080b70}
      # Р-81: the server derives the country of a feedback message from the visitor's address with the DB-IP "IP to Country
      # Lite" database, which it downloads from download.db-ip.com in the background (CC BY 4.0; the address is not stored).
      # false: no download, feedback is stored without a country.
      HERD_GEOIP_ENABLED: ${HERD_GEOIP_ENABLED:-true}
      # Р-81: how much feedback the server takes (docs/research/server_design.md §22.4): per client address a burst of
      # CAPACITY messages and REFILL_PER_HOUR tokens back every hour; MAX_PER_DAY from everyone together in any 24 hours.
      HERD_FEEDBACK_RATE_LIMIT_CAPACITY: ${HERD_FEEDBACK_RATE_LIMIT_CAPACITY:-5}
      HERD_FEEDBACK_RATE_LIMIT_REFILL_PER_HOUR: ${HERD_FEEDBACK_RATE_LIMIT_REFILL_PER_HOUR:-6}
      HERD_FEEDBACK_MAX_PER_DAY: ${HERD_FEEDBACK_MAX_PER_DAY:-1000}
      HERD_DB_USER: herd
      # Task item 3: same value as `db`'s own POSTGRES_PASSWORD above (tools/stand.sh generates
      # it into .env once, reused by both, same "one shared secret, two env var names" pattern as
      # HERD_CHAINSVC_TOKEN/C2_SVC_TOKEN below).
      HERD_DB_PASSWORD: ${HERD_DB_PASSWORD:?set in .env — run tools/stand.sh up, which generates one}
      # Service name in this compose file is "db", not application.properties' default
      # "postgres" — see docs/product/local_stand.md "Известные ограничения и фиксы".
      HERD_DB_URL: jdbc:postgresql://db:5432/herd
      # chainsvc runs with network_mode: host (see its own fix note above), so it has no
      # "chainsvc" DNS name on herd_default — reached via that network's own gateway IP instead,
      # fixed by the `networks.default.ipam` block above at the top of this file.
      HERD_CHAINSVC_URL: http://172.28.77.1:8090
      # FIXED INTERFACE (a): same value as chainsvc's own C2_SVC_TOKEN above.
      HERD_CHAINSVC_TOKEN: ${HERD_CHAINSVC_TOKEN:?set in .env — run tools/stand.sh up, which generates one}
      HERD_OPERATOR_TOKEN: ${HERD_OPERATOR_TOKEN:?set in .env — run tools/stand.sh up, which generates one}
      # Р-53 live verification (2026-09-26): turns on the real on-chain withdraw/deposit path
      # (WithdrawalPollerService/DepositPollerService both no-op while these are false) — off by
      # default (application.properties) until this stand actually needed to exercise it end to
      # end on testnet11.
      HERD_WITHDRAWAL_ENABLED: "true"
      HERD_DEPOSIT_ENABLED: "true"
      # Economy (plan B1, B3): the server defaults when unset - opening of TREASURY in PLAY, registrations per address per day.
      HERD_ECONOMY_TREASURY_OPENING_PLAY: "${HERD_ECONOMY_TREASURY_OPENING_PLAY:-99998100}"
      HERD_REGISTRATION_MAX_PER_IP_PER_DAY: "${HERD_REGISTRATION_MAX_PER_IP_PER_DAY:-20}"
      HERD_BOTS_RESPAWN_DELAY_MS: "${HERD_BOTS_RESPAWN_DELAY_MS:-3600000}"
    depends_on:
      db:
        condition: service_healthy
      chainsvc:
        condition: service_healthy
    healthcheck:
      # Exercises the real RPC path (DB reachable, event log rebuilt, round scheduler alive) —
      # not just "the JVM booted". empty args array = FIXED INTERFACE (1)'s no-argument call.
      test:
        - CMD-SHELL
        - >-
          curl -sf -o /dev/null -X POST -H 'Content-Type: application/json' -d '{"args":[]}'
          http://127.0.0.1:8081/api/rpc/serverInfo || exit 1
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # Fix: same no-DNS/egress default bridge network — `npm ci` needs registry.npmjs.org. The
      # "web" agent's report documents the identical failure as a sandbox limitation; it recurs
      # here for the same reason (this Mac's Docker default bridge network, not the sandbox).
      network: ${HERD_BUILD_NETWORK:-host} # the VPS: default (see chainsvc above)
      args:
        # Р-55: WalletConnect/Reown projectId for Sage sign-in (public, not a secret —
        # it ships in the web bundle). Value lives in .env (Р-55, Alex, 2026-09-26).
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
    ports:
      - "${HERD_WEB_PORT:-8480}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  # Live-price epoch database (Р-70/Р-71): a NEW volume on purpose. The replay-epoch volume `herd_pg`
  # (BTC only, accelerated history, rounds anchored to the first server start) is no longer
  # declared here — it stays on the machine untouched as an archive of that game. A new database
  # also gets the round calendar of markets_architecture.md Т-11 (boundaries on multiples of the
  # round length). `tools/stand.sh reset` removes this volume only, by name; `docker compose down
  # -v` can only reach volumes declared in this file.
  herd_pg_live:
    name: herd_pg_live
